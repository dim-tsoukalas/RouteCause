[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-investigator"
version = "0.1.0"
description = "A citation-grounded BGP-incident investigator: deterministic anomaly detection + cited RFC retrieval, abstains rather than guessing when it can't ground a claim."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# The core (deterministic analyzers, BM25 citation retrieval, offline CLI,
# competing-hypothesis / contradiction / citation-correctness scoring with
# the default lexical checker) runs on the standard library alone -- these
# extras only activate the production paths documented in the README/
# docs/design.md. requirements.txt installs the [all] extra so the two
# never drift apart.
[project.optional-dependencies]
ingest = ["mrtparse>=2.0"]            # investigator/ingest.py: real RIPE RIS / RouteViews data
llm = ["litellm>=1.40"]               # provider-agnostic LLM narration
nli = ["sentence-transformers>=3.0"]  # real cross-encoder NLI entailment checking
dev = ["pytest>=8.0"]
all = ["network-investigator[ingest,llm,nli,dev]"]

[project.scripts]
investigate = "investigator.cli:investigate_main"
ask = "investigator.cli:ask_main"
investigator-ingest = "investigator.ingest:main"
investigator-evaluate = "investigator.evaluate:main"

[tool.setuptools.packages.find]
include = ["investigator*"]
